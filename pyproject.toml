[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenik-ai-studio"
version = "0.1.0"
description = "Zenix AI Studio cloud orchestrator (Phase 0 dry-run foundation)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["packages/core"]
include = ["zenik_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/core"]
